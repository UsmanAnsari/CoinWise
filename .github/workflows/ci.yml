name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  kmp-boundary:
    name: kmp-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Verify KMP Boundaries
        run: ./gradlew verifyKmpReadiness verifySharedTier

  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Run Tests and Verification
        run: ./gradlew check --continue

      - name: Publish Test Results Summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          detailed_summary: true

      - name: Upload Reports Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios-compile:
    name: ios-compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native Toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile the shared tier for iOS
        run: ./gradlew compileKotlinIosArm64

      - name: Link the umbrella framework
        run: ./gradlew :shared:umbrella:linkReleaseFrameworkIosArm64

  build-release:
    name: build-release
    needs: [ kmp-boundary, test-and-lint, ios-compile ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble release (R8 enabled, unsigned)
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK and mapping
        uses: actions/upload-artifact@v5
        with:
          name: coinwise-release-unsigned
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 14